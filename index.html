<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet"  href="loginForm.css">
</head>
<body>
    
    <div class="login-box">
     <div class="avatar-box">
    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="avatar">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>
  </div>
        <h2 class="lmsg">Member Login</h2>
        <p class="Emsg">Email</p>
        <input class="email" type="email" placeholder="test@gmail.com">
        <p class="error"></p>
        <p class="Pmsg">Password</p>
        <input class="pass" type="password" placeholder="1234">
        <p class="perror"></p>
        <p class="forget">Forget Password?</p>
         <button class="btn" type="submit">Login</button>
         <p class="or">or contnue with</p>
<div class="social-login">
        <button class="google"><img src="google.png.png"></button>
        <button class="github"><img src="github.png.png"></button>
        <button class="facebook"><img src="facebook.png.png"></button>
        
    </div>
    <p class="dont">Dont't have an account?</p>
    <h5 class="register">register free</h5>
    </div>
    
    <script src="loginForm.js"></script>
</body>
</html>
